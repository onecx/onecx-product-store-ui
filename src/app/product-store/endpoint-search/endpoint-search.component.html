<ocx-portal-page permission="ENDPOINT#SEARCH" helpArticleId="PAGE_ENDPOINT_SEARCH">
  <ocx-search-header
    [header]="'DIALOG.SEARCH.ENDPOINTS.HEADER' | translate"
    [subheader]="'DIALOG.SEARCH.ENDPOINTS.SUBHEADER' | translate"
    (searched)="onSearch()"
    (resetted)="onCriteriaReset()"
    [manualBreadcrumbs]="false"
    [actions]="(actions$ | async) ?? []"
  >
    <div id="ps_endpoint_search_criteria" [formGroup]="searchCriteriaForm" class="flex flex-row flex-wrap gap-3">
      <p-floatlabel variant="on">
        <input
          id="ps_endpoint_search_criteria_product_name"
          pInputText
          type="text"
          class="w-11rem sm:w-18rem text-responsive"
          formControlName="name"
          [attr.aria-label]="'ACTIONS.SEARCH.ENDPOINT.PRODUCT_NAME' | translate"
          [pTooltip]="
            ('ACTIONS.SEARCH.ENDPOINT.PRODUCT_NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)
          "
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_endpoint_search_criteria_product_name">{{ 'APP.PRODUCT_NAME' | translate }}</label>
      </p-floatlabel>
    </div>
  </ocx-search-header>

  @let data = $any((filteredData$ | async) ?? []);
  <ocx-content class="ocx-content">
    @if (loading) {
      <p-message
        id="ps_endpoint_search_loading_message"
        severity="info"
        styleClass="m-3 p-2"
        [text]="'ACTIONS.LOADING' | translate"
      ></p-message>
    } @else if (exceptionKey) {
      <p-message
        id="ps_endpoint_search_error_message"
        severity="error"
        styleClass="m-3 p-2"
        [text]="exceptionKey | translate"
      ></p-message>
    }
    <ocx-interactive-data-view
      id="ps_endpoint_search_table"
      [data]="data"
      [supportedViewLayouts]="['table']"
      [layout]="'table'"
      [columns]="interactiveColumns"
      [displayedColumnKeys]="interactiveDisplayedColumnKeys"
      [listGridPaginator]="false"
      [tablePaginator]="true"
      [pageSize]="10"
      [pageSizes]="[10, 30, 100]"
      [emptyResultsMessage]="'ACTIONS.SEARCH.NO_DATA' | translate"
      [disableFilterView]="true"
      [clientSideFiltering]="true"
      [clientSideSorting]="true"
      [filters]="interactiveFilters"
      [sortField]="interactiveSortField"
      [sortDirection]="interactiveSortDirection"
      [actionColumnPosition]="'left'"
      (filtered)="onInteractiveFiltersChange($event)"
      (sorted)="onInteractiveSorted($event)"
      (dataViewLayoutChange)="onLayoutChange($event)"
    >
      <ng-template #topCenter>
        <p-inputgroup class="w-auto">
          <p-inputgroup-addon>
            <i class="pi pi-filter" aria-hidden="true"></i>
          </p-inputgroup-addon>
          <p-floatlabel variant="on">
            <input
              #globalFilterInput
              id="ps_endpoint_search_filter"
              type="text"
              pInputText
              [value]="globalFilterValue"
              (input)="onGlobalFilter(globalFilterInput.value)"
              [pTooltip]="'SEARCH.ENDPOINT.FILTER.TOOLTIP' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <label for="ps_endpoint_search_filter" aria-hidden="true">
              {{ 'SEARCH.ENDPOINT.FILTER.LABEL' | translate }}</label
            >
          </p-floatlabel>
          <p-button
            id="ps_endpoint_search_filter_clear"
            icon="pi pi-filter-slash"
            (onClick)="onGlobalFilter('')"
            [disabled]="!globalFilterValue"
            [ariaLabel]="'SEARCH.ENDPOINT.FILTER.CLEAR' | translate"
            [pTooltip]="'SEARCH.ENDPOINT.FILTER.CLEAR' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          />
        </p-inputgroup>
      </ng-template>

      <ng-template pTemplate="appNameIdTableCell" let-rowObject="rowObject" let-column="column">
        <a
          tabindex="0"
          class="p-2 bookmark-link font-italic text-primary cursor-pointer"
          [id]="'ps_endpoint_search_table_row_' + rowObject['unique_id'] + '_app_name'"
          (click)="onAppDetail($event, rowObject)"
          (keydown.enter)="onAppDetail($event, rowObject)"
          (keydown.space)="onAppDetail($event, rowObject)"
          [attr.aria-label]="'ACTIONS.NAVIGATION.DETAILS.TOOLTIP' | translate"
          [pTooltip]="'ACTIONS.NAVIGATION.DETAILS.TOOLTIP' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        >
          {{ rowObject['appName'] }}
        </a>
      </ng-template>
    </ocx-interactive-data-view>
  </ocx-content>
</ocx-portal-page>

<app-app-detail
  [displayDialog]="displayAppDetailDialog"
  [appAbstract]="mfeItem4Detail"
  (appChanged)="onMfeChanged($event)"
></app-app-detail>
