<ocx-portal-page permission="ENDPOINT#SEARCH" helpArticleId="PAGE_ENDPOINT_SEARCH">
  <ocx-search-header
    [header]="'DIALOG.SEARCH.ENDPOINTS.HEADER' | translate"
    [subheader]="'DIALOG.SEARCH.ENDPOINTS.SUBHEADER' | translate"
    [resetButtonAriaLabel]="'DIALOG.SEARCH.RESET_BUTTON.ARIA_LABEL' | translate"
    [resetButtonTooltip]="'DIALOG.SEARCH.RESET_BUTTON.TOOLTIP' | translate"
    (searched)="onSearch()"
    (resetted)="onCriteriaReset()"
    [manualBreadcrumbs]="false"
    [actions]="(actions$ | async) ?? []"
  >
    <div id="ps_endpoint_search_criteria" [formGroup]="searchCriteriaForm" class="flex flex-row flex-wrap gap-3">
      <p-floatlabel variant="on">
        <input
          id="ps_endpoint_search_criteria_product_name"
          pInputText
          type="text"
          class="w-11rem sm:w-18rem text-responsive"
          formControlName="productDisplayName"
          [ariaLabel]="'ACTIONS.SEARCH.ENDPOINT.PRODUCT_NAME' | translate"
          [pTooltip]="
            ('ACTIONS.SEARCH.ENDPOINT.PRODUCT_NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)
          "
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_endpoint_search_criteria_product_name">{{ 'ENDPOINT.PRODUCT_NAME' | translate }}</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input
          id="ps_endpoint_search_criteria_microfrontend_name"
          pInputText
          type="text"
          class="w-11rem sm:w-18rem text-responsive"
          formControlName="microfrontendName"
          [ariaLabel]="'ENDPOINT.APP_NAME' | translate"
          [pTooltip]="('ENDPOINT.TOOLTIPS.APP_NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_endpoint_search_criteria_microfrontend_name">{{ 'ENDPOINT.APP_NAME' | translate }}</label>
      </p-floatlabel>
    </div>
  </ocx-search-header>

  @let data = $any((filteredData$ | async) ?? []);
  <ocx-content class="ocx-content">
    <div class="flex flex-column">
      <!-- HEADER -->
      <div
        class="p-3 flex flex-row flex-wrap justify-content-between align-items-center column-gap-4 row-gap-1 border-bottom-1 border-100"
      >
        <!-- INFO -->
        <div id="ps_roles_messages">
          @if (loading) {
            <p-message
              id="ps_endpoint_search_loading_message"
              severity="info"
              styleClass="w-fit"
              [text]="'ACTIONS.LOADING' | translate"
            ></p-message>
          } @else if (exceptionKey) {
            <p-message
              id="ps_endpoint_search_error_message"
              severity="error"
              styleClass="w-fit"
              [text]="exceptionKey | translate"
            ></p-message>
          } @else {
            <!-- QUICK FILTER -->
            <nav></nav>
          }
        </div>
        <!-- FILTER -->
        <p-inputgroup class="w-auto">
          <p-inputgroup-addon class="pi pi-filter" aria-hidden="true"> </p-inputgroup-addon>
          <p-floatlabel variant="on">
            <input
              #globalFilterInput
              type="text"
              pInputText
              id="ps_roles_filter"
              class="text-responsive"
              [value]="globalFilterValue"
              (input)="onGlobalFilter(globalFilterInput.value)"
              [ariaLabel]="'DIALOG.DATAVIEW.FILTER.LABEL' | translate"
              [pTooltip]="
                ('DIALOG.DATAVIEW.FILTER.OF' | translate) +
                ('ENDPOINT.NAME.SEARCH' | translate) +
                ', ' +
                ('ENDPOINT.PATH' | translate) +
                ', ' +
                ('ENDPOINT.APP_NAME' | translate) +
                ', ' +
                ('ENDPOINT.PRODUCT_NAME' | translate)
              "
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <label for="ps_roles_filter" aria-hidden="true">
              {{ 'DIALOG.DATAVIEW.FILTER.LABEL' | translate }}
            </label>
          </p-floatlabel>
          <p-inputgroup-addon>
            <p-button
              id="ps_roles_filter_clear"
              icon="pi pi-filter-slash"
              class="h-full"
              (onClick)="onGlobalFilter('')"
              [disabled]="globalFilterInput.value === ''"
              [ariaLabel]="'DIALOG.DATAVIEW.FILTER.CLEAR' | translate"
              [pTooltip]="'DIALOG.DATAVIEW.FILTER.CLEAR' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            />
          </p-inputgroup-addon>
        </p-inputgroup>
        <!-- ACTIONS -->
        <nav
          class="flex flex-wrap align-is-center column-gap-2 row-gap-1"
          [attr.aria-label]="'ACTIONS.NAVIGATION.RELATED_TOPICS' | translate"
        >
          <p-button
            id="ps_endpoint_search_header_reload"
            styleClass="h-full"
            [icon]="'pi ' + (loading ? 'pi-spin pi-spinner' : 'pi-refresh')"
            [disabled]="loading"
            (onClick)="onMfeChanged(true)"
            [ariaLabel]="'ACTIONS.SEARCH.RELOAD' | translate"
            [pTooltip]="'ACTIONS.SEARCH.RELOAD' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          >
          </p-button>
        </nav>
      </div>

      <!-- DATA -->
      <ocx-data-view
        #rolesDataView
        id="ps_endpoint_search_table"
        [columns]="interactiveColumns"
        [data]="data"
        [layout]="'table'"
        [paginator]="true"
        [pageSizes]="[10, 30, 100]"
        [pageSize]="20"
        [clientSideSorting]="false"
        [clientSideFiltering]="true"
        [emptyResultsMessage]="'ACTIONS.SEARCH.NO_DATA' | translate"
        [clientSideFiltering]="true"
        [clientSideSorting]="true"
        [filters]="interactiveFilters"
        (filtered)="onInteractiveFiltersChange($event)"
        [sortField]="interactiveSortField"
        [sortDirection]="interactiveSortDirection"
        (sorted)="onInteractiveSorted($event)"
      >
        <!-- HEADER -->
        <ng-template
          pTemplate="endpointNameIdTableHeader"
          let-column="column"
          let-sortTemplate="sortTemplate"
          let-filterTemplate="filterTemplate"
        >
          <div class="flex flex-row justify-content-start align-items-center column-gap-2">
            <div>{{ column.nameKey | translate }}</div>
            <div class="icon-button-header-wrapper">
              <span class="custom-header-sort">
                <ng-container
                  [ngTemplateOutlet]="sortTemplate"
                  [ngTemplateOutletContext]="{ column: column }"
                ></ng-container>
              </span>
              <span>
                <ng-container
                  [ngTemplateOutlet]="filterTemplate"
                  [ngTemplateOutletContext]="{ column: column }"
                ></ng-container>
              </span>
            </div>
          </div>
        </ng-template>

        <ng-template
          pTemplate="appNameIdTableHeader"
          let-column="column"
          let-sortTemplate="sortTemplate"
          let-filterTemplate="filterTemplate"
        >
          <div class="flex flex-row justify-content-start align-items-center column-gap-2">
            <div>{{ column.nameKey | translate }}</div>
            <div class="icon-button-header-wrapper">
              <span class="custom-header-sort">
                <ng-container
                  [ngTemplateOutlet]="sortTemplate"
                  [ngTemplateOutletContext]="{ column: column }"
                ></ng-container>
              </span>
              <span>
                <ng-container
                  [ngTemplateOutlet]="filterTemplate"
                  [ngTemplateOutletContext]="{ column: column }"
                ></ng-container>
              </span>
            </div>
          </div>
        </ng-template>

        <ng-template
          pTemplate="productDisplayNameIdTableHeader"
          let-column="column"
          let-sortTemplate="sortTemplate"
          let-filterTemplate="filterTemplate"
        >
          <div class="flex flex-row justify-content-start align-items-center column-gap-2">
            <div>{{ column.nameKey | translate }}</div>
            <div class="icon-button-header-wrapper">
              <span class="custom-header-sort">
                <ng-container
                  [ngTemplateOutlet]="sortTemplate"
                  [ngTemplateOutletContext]="{ column: column }"
                ></ng-container>
              </span>
              <span>
                <ng-container
                  [ngTemplateOutlet]="filterTemplate"
                  [ngTemplateOutletContext]="{ column: column }"
                ></ng-container>
              </span>
            </div>
          </div>
        </ng-template>

        <!-- BODY -->
        <ng-template pTemplate="appNameIdTableCell" let-rowObject="rowObject">
          <a
            tabindex="0"
            class="p-2 bookmark-link font-italic text-primary cursor-pointer"
            [id]="'ps_endpoint_search_table_row_' + rowObject['unique_id'] + '_app_name'"
            (click)="onAppDetail($event, rowObject)"
            (keydown.enter)="onAppDetail($event, rowObject)"
            (keydown.space)="onAppDetail($event, rowObject)"
            [attr.aria-label]="'ACTIONS.NAVIGATION.DETAILS.TOOLTIP' | translate"
            [pTooltip]="'ACTIONS.NAVIGATION.DETAILS.TOOLTIP' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          >
            {{ rowObject['appName'] }}
          </a>
        </ng-template>

        <ng-template pTemplate="productDisplayNameIdTableCell" let-rowObject="rowObject">
          <a
            tabindex="0"
            [id]="'ps_endpoint_search_table_row_' + rowObject['id'] + '_goto_product'"
            class="bookmark-link font-italic text-primary cursor-pointer"
            (click)="onGotoProduct($event, rowObject)"
            (keydown.enter)="onGotoProduct($event, rowObject)"
            (keydown.space)="onGotoProduct($event, rowObject)"
            [attr.aria-label]="'ACTIONS.NAVIGATION.LINKS.GOTO.PRODUCT' | translate"
            [pTooltip]="'ACTIONS.NAVIGATION.LINKS.GOTO.PRODUCT' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          >
            {{ rowObject['productDisplayName'] }}
          </a>
        </ng-template>
      </ocx-data-view>
    </div>
  </ocx-content>
</ocx-portal-page>

<app-app-detail
  [displayDialog]="displayAppDetailDialog"
  [appAbstract]="mfeItem4Detail"
  (appChanged)="onMfeChanged($event)"
></app-app-detail>
