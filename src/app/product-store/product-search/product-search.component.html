<ocx-portal-page permission="PRODUCT#SEARCH" helpArticleId="PAGE_PRODUCT_SEARCH">
  <ocx-search-header
    [header]="'DIALOG.SEARCH.HEADER' | translate"
    [subheader]="'DIALOG.SEARCH.SUBHEADER' | translate"
    (searched)="onSearch()"
    (resetted)="onSearchReset()"
    [manualBreadcrumbs]="false"
    [actions]="(actions$ | async) ?? []"
  >
    <div id="ps_product_search_criteria" [formGroup]="searchCriteria" class="flex flex-row flex-wrap gap-3">
      <p-floatlabel>
        <input
          id="ps_product_search_criteria_name"
          pInputText
          type="text"
          class="w-11rem sm:w-15rem text-responsive"
          formControlName="name"
          [attr.aria-label]="'PRODUCT.NAME' | translate"
          [pTooltip]="('PRODUCT.CRITERIA.NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_product_search_criteria_name" aria-hidden="true">{{ 'PRODUCT.NAME' | translate }}</label>
      </p-floatlabel>
      <ng-container *ngIf="criteria$ | async as criteria">
        <p-floatlabel>
          <p-multiSelect
            id="ps_product_search_criteria_providers"
            formControlName="providers"
            styleClass="text-responsive"
            [options]="criteria.providers"
            appendTo="body"
            display="chip"
            [maxSelectedLabels]="2"
            [emptyMessage]="'ACTIONS.SEARCH.NO_DATA' | translate"
            [ariaLabel]="'PRODUCT.PROVIDER' | translate"
            [pTooltip]="'PRODUCT.CRITERIA.PROVIDER' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          />
          <label for="ps_product_search_criteria_providers" aria-hidden="true">
            {{ 'PRODUCT.PROVIDER' | translate }}
          </label>
        </p-floatlabel>
        <p-floatlabel>
          <p-multiSelect
            id="ps_product_search_criteria_classifications"
            formControlName="classifications"
            styleClass="correct-min-size text-responsive"
            [options]="criteria.classifications"
            appendTo="body"
            display="chip"
            [maxSelectedLabels]="2"
            [emptyMessage]="'ACTIONS.SEARCH.NO_DATA' | translate"
            [ariaLabel]="'PRODUCT.CLASSIFICATIONS' | translate"
            [pTooltip]="'PRODUCT.CRITERIA.CLASSIFICATIONS' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          />
          <label for="ps_product_search_criteria_classifications" aria-hidden="true">
            {{ 'PRODUCT.CLASSIFICATIONS' | translate }}
          </label>
        </p-floatlabel>
      </ng-container>
    </div>
  </ocx-search-header>

  <ocx-content *ngIf="products$ | async as products">
    <p-message
      *ngIf="loading && !exceptionKey"
      id="ps_product_search_loading_message"
      severity="info"
      styleClass="m-3"
      [text]="'ACTIONS.LOADING' | translate"
    ></p-message>
    <p-message
      *ngIf="exceptionKey"
      id="ps_product_search_error_message"
      severity="error"
      styleClass="m-3"
      [text]="exceptionKey | translate"
    ></p-message>

    <ocx-interactive-data-view
      *ngIf="!loading && !exceptionKey"
      id="ps_product_search_dataview"
      [data]="$any(products)"
      [supportedViewLayouts]="['grid', 'list']"
      [layout]="viewMode"
      [columns]="dataViewColumns"
      [listGridPaginator]="true"
      [tablePaginator]="false"
      [pageSizes]="viewMode === 'grid' ? [100, 1000] : [20, 50, 100]"
      [pageSize]="viewMode === 'grid' ? 100 : 20"
      [emptyResultsMessage]="'ACTIONS.SEARCH.NOT_FOUND' | translate"
      [disableFilterView]="true"
      [clientSideFiltering]="true"
      [clientSideSorting]="true"
      [sortField]="sortField"
      [sortDirection]="sortDirection"
      [actionColumnPosition]="'left'"
      (sorted)="onInteractiveSorted($event)"
      (dataViewLayoutChange)="onLayoutChange($event)"
    >
      <ng-template #topCenter>
        <p-inputgroup class="w-auto tm-filter-group">
          <p-inputgroup-addon>
            <i class="pi pi-filter"></i>
          </p-inputgroup-addon>
          <p-floatlabel>
            <input
              #filterInput
              id="tm_search_filter"
              type="text"
              class="tm-filter-input"
              pInputText
              [value]="filter ?? ''"
              [tooltipPosition]="'bottom'"
              [pTooltip]="'SEARCH.FILTER.TOOLTIP' | translate"
              tooltipEvent="hover"
              (input)="onFilterChange(filterInput.value)"
            />
            <label for="tm_search_filter" aria-hidden="true"> {{ 'SEARCH.FILTER.LABEL' | translate }}</label>
          </p-floatlabel>
          <p-button
            id="tm_search_filter_clear"
            icon="pi pi-filter-slash"
            styleClass="tm-filter-clear"
            [disabled]="!filter"
            [ariaLabel]="'SEARCH.FILTER.CLEAR' | translate"
            [pTooltip]="'SEARCH.FILTER.CLEAR' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
            (click)="onFilterChange('')"
            (keydown.enter)="onFilterChange('')"
          />
        </p-inputgroup>
      </ng-template>

      <ng-template #listItem let-product>
        <article class="col-12 md:col-6">
          <div
            [id]="'ps_product_search_data_list_row_' + product.name"
            class="flex flex-row flex-nowrap justify-content-start align-items-center column-gap-3 py-1 px-1 sm:px-2 hover:bg-gray-200 cursor-pointer"
            [routerLink]="['./' + product.name]"
          >
            <div class="p-0 col-3 text-center">
              <app-image-container
                [id]="'ps_product_search_data_list_row_' + product.name + '_image'"
                styleClass="max-h-3rem sm:max-h-4rem max-w-4rem sm:max-w-6rem border-round-sm"
                [imageUrl]="getLogoUrl(product)"
              ></app-image-container>
            </div>
            <div
              class="p-0 col-9 h-4rem sm:h-5rem max-h-4rem sm:max-h-5rem flex flex-column justify-content-center gap-1"
            >
              <div
                [id]="'ps_product_search_data_list_row_' + product.name + '_product_display_name'"
                class="font-bold text-sm md:text-base md:text-lg text-responsive"
                [class.danger-action-text]="product.undeployed"
              >
                {{ product.displayName }}
              </div>
              <div
                class="hidden sm:block text-xs sm:text-sm text-responsive"
                [id]="'ps_product_search_data_list_row_' + product.name + '_classifications'"
              >
                {{ product.classes }}
              </div>
              <div class="flex flex-row column-gap-2 align-items-center">
                <span *ngIf="product.provider" class="pi pi-users"></span>
                <span
                  [id]="'ps_product_search_data_list_row_' + product.name + '_provider'"
                  class="text-xs sm:text-sm md:text-base text-responsive"
                  [attr.aria-label]="product.provider"
                  [pTooltip]="'PRODUCT.PROVIDER' | translate"
                  tooltipPosition="top"
                  tooltipEvent="hover"
                >
                  {{ product.provider }}
                </span>
              </div>
              <div
                class="text-xs sm:text-sm text-responsive"
                [id]="'ps_product_search_data_list_row_' + product.name + '_version'"
              >
                Version: {{ product.version }}
              </div>
            </div>
          </div>
        </article>
      </ng-template>

      <ng-template #gridItem let-product>
        <div class="col-6 md:col-4 xl:col-3 p-2 md:px-3" [attr.aria-label]="product.displayName">
          <a
            [id]="'ps_product_search_data_grid_row_' + product.name"
            class="card relative p-1 sm:p-2 sm:px-3 flex flex-column gap-1 lg:gap-2 justify-content-between text-center hover:bg-gray-200 cursor-pointer"
            routerLinkActive="active"
            [routerLink]="['./', product.name]"
            [attr.aria-label]="'ACTIONS.NAVIGATION.LINKS.GOTO.PRODUCT' | translate"
            role="link"
          >
            <!-- BADGES -->
            <div
              *ngIf="!product?.multitenancy"
              [id]="'ps_product_search_data_grid_row_' + product.name + '_multitenancy'"
              class="card-badge-left badge-1 p-2 pi pi-user-minus text-xl"
              [attr.aria-label]="'INTERNAL.TOOLTIPS.MULTITENANCY_SEARCH' | translate"
              [pTooltip]="'INTERNAL.TOOLTIPS.MULTITENANCY_SEARCH' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
              role="note"
            ></div>
            <div
              *ngIf="product?.undeployed"
              [id]="'ps_product_search_data_grid_row_' + product.name + '_undeployed'"
              class="card-badge-right badge-1 p-2 pi pi-ban danger-action-text text-xl"
              [attr.aria-label]="'PRODUCT.TOOLTIPS.UNDEPLOYED_SEARCH' | translate"
              [pTooltip]="'PRODUCT.TOOLTIPS.UNDEPLOYED_SEARCH' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
              role="note"
            ></div>
            <!-- CONTENT -->
            <div
              [id]="'ps_product_search_data_grid_row_' + product.name + '_product_display_name'"
              class="font-bold text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl text-responsive"
              [class.danger-action-text]="product.undeployed"
              [attr.aria-label]="product.displayName"
              [pTooltip]="product.displayName.length <= 20 ? '' : product.displayName"
              tooltipPosition="top"
              tooltipEvent="hover"
              role="note"
            >
              {{ product.displayName }}
            </div>
            <div
              class="h-3rem sm:h-4rem md:h-7rem lg:h-9rem flex justify-content-center align-items-center"
              aria-hidden="true"
            >
              <app-image-container
                [id]="'ps_product_search_data_grid_row_' + product.name + '_image'"
                styleClass="max-h-3rem sm:max-h-4rem md:max-h-7rem lg:max-h-9rem max-w-6rem sm:max-w-10rem md:max-w-11rem lg:max-w-13rem xl:max-w-14rem"
                [imageUrl]="getLogoUrl(product)"
              ></app-image-container>
            </div>
            <div class="h-2rem sm:h-3rem md:h-4rem flex flex-column justify-content-between text-center">
              <div
                [id]="'ps_product_search_data_grid_row_' + product.name + '_classification'"
                class="hidden sm:block text-xs sm:text-sm md:text-base text-responsive"
                [attr.aria-label]="'PRODUCT.CLASSIFICATIONS' | translate"
                [pTooltip]="'PRODUCT.CLASSIFICATIONS' | translate"
                tooltipPosition="top"
                tooltipEvent="hover"
                role="note"
              >
                {{ product.classes }}
              </div>
              <div class="flex flex-row column-gap-3 justify-content-center align-items-center">
                <span *ngIf="product.provider" class="pi pi-users"></span>
                <span
                  [id]="'ps_product_search_data_grid_row_' + product.name + '_provider'"
                  class="text-xs sm:text-sm md:text-base text-responsive"
                  [attr.aria-label]="'PRODUCT.PROVIDER' | translate"
                  [pTooltip]="'PRODUCT.PROVIDER' | translate"
                  tooltipPosition="top"
                  tooltipEvent="hover"
                  role="note"
                >
                  {{ product.provider }}
                </span>
              </div>
              <div
                [id]="'ps_product_search_data_list_row_' + product.name + '_version'"
                class="text-xs sm:text-sm md:text-base text-responsive"
                [attr.aria-label]="'PRODUCT.VERSION' | translate"
                [pTooltip]="'PRODUCT.VERSION' | translate"
                tooltipPosition="top"
                tooltipEvent="hover"
                role="note"
              >
                Version: {{ product.version ?? ('PRODUCT.VERSION.MISSING' | translate) }}
              </div>
            </div>
          </a>
        </div>
      </ng-template>
    </ocx-interactive-data-view>
  </ocx-content>
</ocx-portal-page>
