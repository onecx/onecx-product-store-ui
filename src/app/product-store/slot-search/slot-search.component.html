<ocx-portal-page permission="SLOT#SEARCH" helpArticleId="PAGE_SLOT_SEARCH">
  <ocx-search-header
    [header]="'DIALOG.SEARCH.SLOTS.HEADER' | translate"
    [subheader]="'DIALOG.SEARCH.SLOTS.SUBHEADER' | translate"
    (searched)="onSearch()"
    (resetted)="onSearchReset()"
    [manualBreadcrumbs]="false"
    [actions]="(actions$ | async) ?? []"
  >
    <form id="ps_slot_search_criteria" [formGroup]="searchCriteriaForm" class="flex flex-row flex-wrap gap-3 md:px-2">
      <p-floatlabel variant="on">
        <input
          pInputText
          id="ps_slot_search_criteria_slot_name"
          type="text"
          formControlName="slotName"
          class="w-15rem"
          [attr.aria-label]="'SLOT.NAME' | translate"
          [pTooltip]="('SLOT.TOOLTIPS.NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_slot_search_criteria_slot_name" aria-hidden="true">{{ 'SLOT.NAME' | translate }}</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="ps_slot_search_criteria_product_name"
          type="text"
          formControlName="productName"
          class="w-15rem"
          [attr.aria-label]="'SLOT.PRODUCT_NAME' | translate"
          [pTooltip]="('SLOT.TOOLTIPS.PRODUCT_NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_slot_search_criteria_product_name" aria-hidden="true">
          {{ 'SLOT.PRODUCT_NAME' | translate }}
        </label>
      </p-floatlabel>
    </form>
  </ocx-search-header>

  @let data = (filteredData$ | async) ?? [];
  <ocx-content class="ocx-content">
    @if (loading) {
      <p-message
        id="ps_slot_search_loading_message"
        severity="info"
        styleClass="m-1"
        [text]="'ACTIONS.LOADING' | translate"
      ></p-message>
    } @else if (exceptionKey) {
      <p-message
        id="ps_slot_search_error_message"
        severity="error"
        styleClass="m-1"
        [text]="exceptionKey | translate"
      ></p-message>
    }
    <!-- Always display data table to have a calm user experience -->
    <ocx-interactive-data-view
      id="ps_slot_search_table"
      [data]="data"
      [supportedViewLayouts]="['table']"
      [layout]="'table'"
      [columns]="interactiveColumns"
      [displayedColumnKeys]="interactiveDisplayedColumnKeys"
      [listGridPaginator]="false"
      [tablePaginator]="true"
      [pageSize]="10"
      [pageSizes]="[10, 30, 100]"
      [emptyResultsMessage]="'ACTIONS.SEARCH.NO_DATA' | translate"
      [disableFilterView]="true"
      [clientSideFiltering]="true"
      [clientSideSorting]="true"
      [filters]="interactiveFilters"
      [sortField]="interactiveSortField"
      [sortDirection]="interactiveSortDirection"
      [viewPermission]="hasViewPermission && !hasEditPermission ? 'SLOT#VIEW' : undefined"
      [editPermission]="'SLOT#EDIT'"
      [deletePermission]="'SLOT#DELETE'"
      [additionalActions]="interactiveAdditionalActions"
      [actionColumnPosition]="'left'"
      (filtered)="onInteractiveFiltersChange($event)"
      (sorted)="onInteractiveSorted($event)"
      (viewItem)="onViewFromInteractive($event)"
      (editItem)="onEditFromInteractive($event)"
      (deleteItem)="onDeleteFromInteractive($event)"
      (dataViewLayoutChange)="onLayoutChange($event)"
    >
      <ng-template #topCenter>
        <p-inputgroup class="w-auto">
          <p-inputgroup-addon>
            <i class="pi pi-filter" aria-hidden="true"></i>
          </p-inputgroup-addon>
          <p-floatlabel variant="on">
            <input
              #filterInput
              id="tm_search_filter"
              type="text"
              pInputText
              [value]="filter"
              [tooltipPosition]="'bottom'"
              [pTooltip]="'SEARCH.SLOT.FILTER.TOOLTIP' | translate"
              tooltipEvent="hover"
              (input)="onFilterChange(filterInput.value)"
            />
            <label for="tm_search_filter" aria-hidden="true"> {{ 'SEARCH.SLOT.FILTER.LABEL' | translate }}</label>
          </p-floatlabel>
          <p-button
            id="tm_search_filter_clear"
            icon="pi pi-filter-slash"
            [disabled]="!filter"
            (click)="onFilterChange('')"
            [ariaLabel]="'SEARCH.SLOT.FILTER.CLEAR' | translate"
            [pTooltip]="'SEARCH.SLOT.FILTER.CLEAR' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          />
        </p-inputgroup>
      </ng-template>

      <ng-template
        pTemplate="stateIdTableHeader"
        let-rowObject="rowObject"
        let-column="column"
        let-labelTemplate="labelTemplate"
        let-sortTemplate="sortTemplate"
        let-filterTemplate="filterTemplate"
      >
        <div class="flex flex-row justify-content-center align-items-center gap-3">
          <ng-container
            [ngTemplateOutlet]="labelTemplate"
            [ngTemplateOutletContext]="{ column: column }"
          ></ng-container>
          <ng-container [ngTemplateOutlet]="sortTemplate" [ngTemplateOutletContext]="{ column: column }"></ng-container>
          <!-- FILTER -->
          <div #headerSectionSlotState class="icon-button-header-wrapper">
            <p-button
              tabindex="0"
              id="ps_slot_search_table_header_state_action_filter"
              styleClass="sortButton"
              [text]="true"
              [rounded]="true"
              [icon]="filterStateValue.length === 0 ? 'pi pi-filter' : 'pi pi-filter-fill'"
              (onClick)="onToggleFilterSlotState($event, stateFilterOptions)"
              [ariaLabel]="'SLOT.FILTER.STATE' | translate"
              [pTooltip]="'SLOT.FILTER.STATE' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <!-- This is hidden: only the overlay is shown on click -->
            <p-multiSelect
              #stateFilterOptions
              id="ps_slot_search_table_header_filter_state"
              styleClass="w-full hidden"
              [appendTo]="headerSectionSlotState"
              [showClear]="true"
              [maxSelectedLabels]="1"
              [showToggleAll]="true"
              [showHeader]="true"
              [options]="(filterStateValues$ | async) ?? []"
              optionLabel="label"
              optionValue="value"
              (onChange)="onFilterChange($event.value); onResetFilterIcons($event.value, ['slotName', 'product'])"
              (onPanelShow)="filterPanelSlotStateVisible = true"
              (onPanelHide)="filterPanelSlotStateVisible = false"
              [ngModel]="filterStateValue"
            >
              <ng-template let-state pTemplate="item">
                <div class="ml-2 flex flex-row flex-nowrap align-items-center column-gap-2">
                  <span
                    [class]="'pi ' + state.icon"
                    [ngClass]="{ 'danger-action-text': ['deprecated', 'undeployed'].includes(state.value) }"
                  ></span>
                  <div>{{ state.label }}</div>
                </div>
              </ng-template>
            </p-multiSelect>
          </div>
        </div>
      </ng-template>

      <ng-template pTemplate="stateIdTableCell" let-rowObject="rowObject" let-column="column">
        <div class="slot-state-icons inline-flex flex-nowrap align-items-center justify-content-center column-gap-3">
          <span
            class="pi pi-cog"
            [ngClass]="{ hidden: !rowObject['operator'] }"
            [attr.aria-label]="'SLOT.OPERATOR_SEARCH' | translate"
            [pTooltip]="'SLOT.OPERATOR_SEARCH' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          ></span>
          <span
            class="pi pi-ban danger-action-text"
            [ngClass]="{ hidden: !rowObject['undeployed'] }"
            [attr.aria-label]="'SLOT.UNDEPLOYED_SEARCH' | translate"
            [pTooltip]="'SLOT.UNDEPLOYED_SEARCH' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          ></span>
          <span
            class="pi pi-exclamation-circle danger-action-text"
            [ngClass]="{ hidden: !rowObject['deprecated'] || rowObject['undeployed'] }"
            [attr.aria-label]="'SLOT.DEPRECATED_SEARCH' | translate"
            [pTooltip]="'SLOT.DEPRECATED_SEARCH' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
          ></span>
        </div>
      </ng-template>

      <ng-template pTemplate="productDisplayNameIdTableCell" let-rowObject="rowObject" let-column="column">
        <a
          tabindex="0"
          [id]="'ps_slot_search_table_row_' + rowObject['id'] + '_goto_product'"
          class="bookmark-link font-italic text-primary cursor-pointer"
          (click)="onGotoProduct($event, rowObject)"
          (keydown.enter)="onGotoProduct($event, rowObject)"
          (keydown.space)="onGotoProduct($event, rowObject)"
          [attr.aria-label]="'ACTIONS.NAVIGATION.LINKS.GOTO.PRODUCT' | translate"
          [pTooltip]="'ACTIONS.NAVIGATION.LINKS.GOTO.PRODUCT' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        >
          {{ rowObject['productDisplayName'] }}
        </a>
      </ng-template>
    </ocx-interactive-data-view>
  </ocx-content>
</ocx-portal-page>

<app-slot-detail
  [displayDialog]="displaySlotDetailDialog"
  [slot]="item4Detail"
  [dateFormat]="dateFormat"
  [changeMode]="changeMode"
  (changed)="slotChanged($event)"
></app-slot-detail>

<app-slot-delete
  [displayDialog]="displaySlotDeleteDialog"
  [slot]="item4Delete"
  (slotDeleted)="slotDeleted($event)"
></app-slot-delete>
