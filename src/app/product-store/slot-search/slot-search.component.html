<ocx-portal-page permission="SLOT#SEARCH" helpArticleId="PAGE_SLOT_SEARCH">
  <ocx-search-header
    [header]="'DIALOG.SEARCH.SLOTS.HEADER' | translate"
    [subheader]="'DIALOG.SEARCH.SLOTS.SUBHEADER' | translate"
    (searched)="onSearch()"
    (resetted)="onSearchReset()"
    [manualBreadcrumbs]="false"
    [actions]="(actions$ | async) ?? []"
  >
    <form id="ps_slot_search_criteria" [formGroup]="searchCriteria" class="flex flex-row flex-wrap gap-3 md:px-2">
      <p-float-label>
        <input
          pInputText
          id="ps_slot_search_criteria_slot_name"
          type="text"
          formControlName="slotName"
          class="w-15rem"
          [attr.aria-label]="'SLOT.NAME' | translate"
          [pTooltip]="('SLOT.TOOLTIPS.NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_slot_search_criteria_slot_name" aria-hidden="true">{{ 'SLOT.NAME' | translate }}</label>
      </p-float-label>
      <p-float-label>
        <input
          pInputText
          id="ps_slot_search_criteria_product_name"
          type="text"
          formControlName="productName"
          class="w-15rem"
          [attr.aria-label]="'SLOT.PRODUCT_NAME' | translate"
          [pTooltip]="('SLOT.TOOLTIPS.PRODUCT_NAME' | translate) + ('ACTIONS.SEARCH.WILDCARD_SUPPORT' | translate)"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="ps_slot_search_criteria_product_name" aria-hidden="true">
          {{ 'SLOT.PRODUCT_NAME' | translate }}
        </label>
      </p-float-label>
    </form>
  </ocx-search-header>

  <ocx-content>
    <p-message
      *ngIf="loading"
      id="ps_slot_search_loading_message"
      severity="info"
      styleClass="m-3 p-2"
      [text]="'ACTIONS.LOADING' | translate"
    ></p-message>
    <p-message
      *ngIf="!loading && exceptionKey"
      id="ps_slot_search_error_message"
      severity="error"
      styleClass="m-3 p-2"
      [text]="exceptionKey | translate"
    ></p-message>

    <ocx-interactive-data-view
      *ngIf="!loading"
      id="ps_slot_search_table"
      [data]="$any((filteredData$ | async) ?? [])"
      [supportedViewLayouts]="['table']"
      [layout]="'table'"
      [columns]="interactiveColumns"
      [displayedColumnKeys]="interactiveDisplayedColumnKeys"
      [editPermission]="'SLOT#EDIT'"
      [deletePermission]="'SLOT#DELETE'"
      [additionalActions]="interactiveActions"
      [listGridPaginator]="false"
      [tablePaginator]="true"
      [pageSize]="10"
      [pageSizes]="[10, 30, 100]"
      [emptyResultsMessage]="'ACTIONS.SEARCH.NO_DATA' | translate"
      [disableFilterView]="true"
      [clientSideFiltering]="true"
      [clientSideSorting]="true"
      [filters]="interactiveFilters"
      [sortField]="interactiveSortField"
      [sortDirection]="interactiveSortDirection"
      [actionColumnPosition]="'left'"
      (filtered)="onInteractiveFiltersChange($event)"
      (sorted)="onInteractiveSorted($event)"
      (editItem)="onSlotEdit($event)"
      (deleteItem)="onSlotDeleteAction($event)"
      (dataViewLayoutChange)="onLayoutChange($event)"
    >
      <ng-template #topCenter>
        <p-inputgroup class="w-auto tm-filter-group">
          <p-inputgroup-addon>
            <i class="pi pi-filter"></i>
          </p-inputgroup-addon>
          <p-floatlabel>
            <input
              #filterInput
              id="tm_search_filter"
              type="text"
              class="tm-filter-input"
              pInputText
              [value]="filter"
              [tooltipPosition]="'bottom'"
              [pTooltip]="'SEARCH.FILTER.TOOLTIP' | translate"
              tooltipEvent="hover"
              (input)="onFilterChange(filterInput.value)"
            />
            <label for="tm_search_filter" aria-hidden="true"> {{ 'SEARCH.FILTER.LABEL' | translate }}</label>
          </p-floatlabel>
          <p-button
            id="tm_search_filter_clear"
            icon="pi pi-filter-slash"
            styleClass="tm-filter-clear"
            [disabled]="!filter"
            [ariaLabel]="'SEARCH.FILTER.CLEAR' | translate"
            [pTooltip]="'SEARCH.FILTER.CLEAR' | translate"
            tooltipPosition="top"
            tooltipEvent="hover"
            (click)="onFilterChange('')"
            (keydown.enter)="onFilterChange('')"
          />
        </p-inputgroup>
      </ng-template>
    </ocx-interactive-data-view>
  </ocx-content>
</ocx-portal-page>

<app-slot-detail
  [displayDialog]="displaySlotDetailDialog"
  [slot]="item4Detail"
  [dateFormat]="dateFormat"
  [changeMode]="changeMode"
  (changed)="slotChanged($event)"
></app-slot-detail>

<app-slot-delete
  [displayDialog]="displaySlotDeleteDialog"
  [slot]="item4Delete"
  (slotDeleted)="slotDeleted($event)"
></app-slot-delete>
